<!doctype html>

<html lang="es">

<head>

    <meta charset="UTF-8" />

    <!--
        El viewport ahora corresponde al dispositivo/navegador.
        NO se fija a 4147x1556.
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Alphabet Soup Pro -->
    <link
        rel="stylesheet"
        href="https://use.typekit.net/vsp7vcb.css"
    />

    <title>Cuenta regresiva</title>


    <style>

        /* ==========================================================
           RESET GENERAL
        ========================================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html,
        body {

            /*
            ==========================================================
            IMPORTANTE

            El navegador ocupa siempre el 100%.

            NO colocar aquí:
            width: 4147px;
            height: 1556px;
            ==========================================================
            */

            width: 100%;

            height: 100%;

            overflow: hidden;

            margin: 0;

            padding: 0;

            background: transparent;

            font-family: "alphabet-soup-pro", sans-serif;

            font-weight: 400;

            font-style: normal;

        }



        /* ==========================================================
           LIENZO MAESTRO
           DIMENSIONES INTERNAS FIJAS
        ========================================================== */

        #stage {

            /*
            ==========================================================
            LIENZO MAESTRO

            TODOS los elementos del diseño deben estar dentro
            de este contenedor.

            Tamaño real de diseño:
            4147 x 1556 px
            ==========================================================
            */

            position: absolute;

            left: 0;

            top: 0;

            width: 4147px;

            height: 1556px;

            overflow: hidden;


            /*
            ==========================================================
            OBLIGATORIO PARA EL ESCALADO

            El lienzo siempre crece/disminuye tomando
            como origen la esquina superior izquierda.
            ==========================================================
            */

            transform-origin: top left;


            /*
            JavaScript reemplazará dinámicamente
            el valor de scale().
            */

            transform: scale(1);

        }



        /* ==========================================================
           VIDEO DE FONDO
        ========================================================== */

        #backgroundVideo {

            /*
            El fondo está DENTRO del lienzo maestro.

            No utilizar position: fixed.
            */

            position: absolute;

            left: 0;

            top: 0;

            width: 4147px;

            height: 1556px;

            object-fit: cover;

            z-index: 0;

            pointer-events: none;

        }



        /* ==========================================================
           CONFIGURACIÓN GENERAL DE GRIDS

           Todos los elementos conservan coordenadas absolutas.

           left
           top
           width
           height

           están expresados en píxeles DEL LIENZO MAESTRO.
        ========================================================== */

        .grid-element {

            position: absolute;

            display: grid;

            align-items: center;

            justify-items: center;

            overflow: hidden;

            z-index: 2;

        }



        /* ==========================================================
           GRID 1
           NÚMERO DE DÍAS
        ========================================================== */

        #grid-number {

            left: 2538px;

            top: 44px;

            width: 542px;

            height: 320px;

        }



        #daysNumber {

            /* ======================================================
               CONTROL DE FUENTE DEL NÚMERO
            ====================================================== */

            --font-min: 50px;

            --font-max: 500px;


            color: #df394d;

            font-family: "alphabet-soup-pro", sans-serif;

            font-weight: 400;

            font-style: normal;

            line-height: 0.9;

            text-align: center;

            white-space: nowrap;

            display: inline-block;

        }



        /* ==========================================================
           GRID 2
           PALABRA DÍA / DÍAS
        ========================================================== */

        #grid-days {

            left: 2606px;

            top: 343px;

            width: 410px;

            height: 135px;

        }



        /* ==========================================================
           PASTILLA DÍA / DÍAS
        ========================================================== */

        #daysPill {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            padding: 9px 32px;

            background: #f1688a;

            border-radius: 309px;

        }



        #daysLabel {

            /* ======================================================
               CONTROL DE FUENTE DÍA / DÍAS
            ====================================================== */

            --font-min: 65px;

            --font-max: 100px;


            color: #fce0dd;

            font-family: "alphabet-soup-pro", sans-serif;

            font-weight: 400;

            font-style: normal;

            line-height: 1;

            letter-spacing: 5px;

            text-align: center;

            white-space: nowrap;

            display: inline-block;

        }



        /* ==========================================================
           GRID 3
           FRASES
        ========================================================== */

        #grid-phrase {

            left: 494px;

            top: 815px;

            width: 946px;

            height: 476px;

        }



        #phrase {

            /* ======================================================
               CONTROL DE FUENTE DE LAS FRASES
            ====================================================== */

            --font-min: 80px;

            --font-max: 180px;


            width: 100%;

            color: #df394d;

            font-family: "alphabet-soup-pro", sans-serif;

            font-weight: 400;

            font-style: normal;

            line-height: 1.05;

            text-align: center;

            text-transform: uppercase;

            white-space: normal;

            overflow-wrap: normal;

            word-break: normal;

        }


    </style>

</head>



<body>


    <!-- ==========================================================
         LIENZO MAESTRO
         4147 x 1556
    ========================================================== -->

    <div id="stage">


        <!-- ======================================================
             VIDEO DE FONDO
        ======================================================= -->

        <video
            id="backgroundVideo"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >

            <source
                src="fondo.mp4"
                type="video/mp4"
            />

        </video>



        <!-- ======================================================
             GRID INDEPENDIENTE 1
             NÚMERO
        ======================================================= -->

        <div
            id="grid-number"
            class="grid-element"
        >

            <span id="daysNumber">
                0
            </span>

        </div>



        <!-- ======================================================
             GRID INDEPENDIENTE 2
             DÍA / DÍAS
        ======================================================= -->

        <div
            id="grid-days"
            class="grid-element"
        >

            <div id="daysPill">

                <span id="daysLabel">
                    DÍAS
                </span>

            </div>

        </div>



        <!-- ======================================================
             GRID INDEPENDIENTE 3
             FRASE
        ======================================================= -->

        <div
            id="grid-phrase"
            class="grid-element"
        >

            <div id="phrase">

                PARA DESCUBRIR TU AMIGO SECRETO

            </div>

        </div>


    </div>



    <script>


        /* ================================================================
           DIMENSIONES MAESTRAS
        ================================================================ */

        const MASTER_WIDTH = 4147;

        const MASTER_HEIGHT = 1556;



        /* ================================================================
           ESCALADO RESPONSIVE DEL LIENZO MAESTRO
        ================================================================ */

        function scaleStage() {


            const stage =
                document.getElementById("stage");



            /*
            ================================================================
            ESCALA HORIZONTAL DISPONIBLE
            ================================================================
            */

            const scaleX =
                window.innerWidth /
                MASTER_WIDTH;



            /*
            ================================================================
            ESCALA VERTICAL DISPONIBLE
            ================================================================
            */

            const scaleY =
                window.innerHeight /
                MASTER_HEIGHT;



            /*
            ================================================================
            SE UTILIZA SIEMPRE EL VALOR MÁS PEQUEÑO.

            Esto garantiza que TODO el diseño entre en pantalla.

            Puede quedar espacio sobrante a la derecha o abajo,
            pero nunca se corta el diseño.
            ================================================================
            */

            const scale = Math.min(

                window.innerWidth / 4147,

                window.innerHeight / 1556

            );



            /*
            ================================================================
            ESCALAR TODO EL LIENZO

            Como transform-origin es top left,
            conserva exactamente las coordenadas originales.
            ================================================================
            */

            stage.style.transform =
                `scale(${scale})`;

        }



        /* ================================================================
           EJECUTAR ESCALADO AL CAMBIAR TAMAÑO DEL NAVEGADOR
        ================================================================ */

        window.addEventListener(
            "resize",
            scaleStage
        );



        /* ================================================================
           CONFIGURACIÓN DEL CONTADOR
        ================================================================ */

        const TARGET_MONTH = 9;

        const TARGET_DAY = 19;



        /*
            60000 ms = 60 segundos
        */

        const PHRASE_INTERVAL = 60000;



        /* ================================================================
           FRASES
        ================================================================ */

        const phrases = [

            "PARA DESCUBRIR TU AMIGO SECRETO",

            "PARA CONFESAR TU AMOR A ESA PERSONA ESPECIAL",

            "PARA RECUPERAR ESA AMISTAD PERDIDA",

            "PARA MEJORAR TUS RELACIONES CERCANAS",

            "PARA DESCUBRIR EL AMOR EN ESA AMISTAD",

            "PARA ARMAR PARCHE Y CELEBRAR",

            "Para tener una excusa para celebrar",

            "Para convertir un día normal en un día especial",

            "Para endulzar a tu novio",

            "Para endulzar a tu novia"

        ];



        /* ================================================================
           ELEMENTOS HTML
        ================================================================ */

        const daysNumber =
            document.getElementById(
                "daysNumber"
            );


        const daysLabel =
            document.getElementById(
                "daysLabel"
            );


        const daysPill =
            document.getElementById(
                "daysPill"
            );


        const numberGrid =
            document.getElementById(
                "grid-number"
            );


        const phraseGrid =
            document.getElementById(
                "grid-phrase"
            );


        const phraseElement =
            document.getElementById(
                "phrase"
            );



        /* ================================================================
           OBTENER FECHA DE BOGOTÁ
        ================================================================ */

        function getBogotaDateParts() {


            const formatter =
                new Intl.DateTimeFormat(

                    "en-CA",

                    {

                        timeZone:
                            "America/Bogota",

                        year:
                            "numeric",

                        month:
                            "2-digit",

                        day:
                            "2-digit"

                    }

                );



            const parts =
                formatter.formatToParts(
                    new Date()
                );


            const date = {};



            parts.forEach(
                (part) => {


                    if (

                        part.type === "year" ||

                        part.type === "month" ||

                        part.type === "day"

                    ) {


                        date[part.type] =
                            Number(
                                part.value
                            );


                    }


                }
            );



            return date;

        }



        /* ================================================================
           CALCULAR DÍAS RESTANTES
        ================================================================ */

        function calculateRemainingDays() {


            const today =
                getBogotaDateParts();



            const todayUTC =
                Date.UTC(

                    today.year,

                    today.month - 1,

                    today.day

                );



            const targetUTC =
                Date.UTC(

                    today.year,

                    TARGET_MONTH - 1,

                    TARGET_DAY

                );



            const millisecondsPerDay =
                24 *
                60 *
                60 *
                1000;



            let days =
                Math.round(

                    (
                        targetUTC -
                        todayUTC
                    )

                    /

                    millisecondsPerDay

                );



            /*
            Nunca mostrar números negativos.
            */

            days =
                Math.max(
                    0,
                    days
                );



            return days;

        }



        /* ================================================================
           LEER VARIABLES DE FUENTE DESDE CSS
        ================================================================ */

        function getCSSFontValue(
            element,
            variable
        ) {


            const styles =
                getComputedStyle(
                    element
                );



            const value =
                styles
                    .getPropertyValue(
                        variable
                    )
                    .trim();



            return parseFloat(
                value
            );

        }



        /* ================================================================
           AUTOAJUSTE DE TEXTO

           El mínimo y máximo se controlan en CSS mediante:

           --font-min
           --font-max
        ================================================================ */

        function fitText(
            element,
            container
        ) {


            let minimum =
                getCSSFontValue(

                    element,

                    "--font-min"

                );



            let maximum =
                getCSSFontValue(

                    element,

                    "--font-max"

                );



            /*
            Valores de seguridad.
            */

            if (
                isNaN(minimum)
            ) {

                minimum = 10;

            }



            if (
                isNaN(maximum)
            ) {

                maximum = 100;

            }



            let low =
                minimum;


            let high =
                maximum;


            let best =
                minimum;



            /*
            Búsqueda binaria del tamaño
            máximo que cabe en el grid.
            */

            while (
                low <= high
            ) {


                const middle =
                    Math.floor(

                        (
                            low +
                            high
                        )

                        /

                        2

                    );



                element.style.fontSize =
                    middle +
                    "px";



                const fitsWidth =

                    element.scrollWidth <=
                    container.clientWidth;



                const fitsHeight =

                    element.scrollHeight <=
                    container.clientHeight;



                if (
                    fitsWidth &&
                    fitsHeight
                ) {


                    best =
                        middle;


                    low =
                        middle + 1;


                }

                else {


                    high =
                        middle - 1;


                }


            }



            element.style.fontSize =
                best +
                "px";

        }



        /* ================================================================
           AJUSTAR NÚMERO
        ================================================================ */

        function fitNumber() {


            fitText(

                daysNumber,

                numberGrid

            );

        }



        /* ================================================================
           AJUSTAR DÍA / DÍAS
        ================================================================ */

        function fitDaysLabel() {


            fitText(

                daysLabel,

                daysPill

            );

        }



        /* ================================================================
           AJUSTAR FRASE
        ================================================================ */

        function fitPhrase() {


            fitText(

                phraseElement,

                phraseGrid

            );

        }



        /* ================================================================
           ACTUALIZAR CONTADOR
        ================================================================ */

        function updateCountdown() {


            const remainingDays =
                calculateRemainingDays();



            /* ==========================================================
               NÚMERO
            ========================================================== */

            daysNumber.textContent =
                remainingDays;



            /* ==========================================================
               DÍA / DÍAS

               1  = DÍA
               resto = DÍAS
            ========================================================== */

            if (
                remainingDays === 1
            ) {


                daysLabel.textContent =
                    "DÍA";


            }

            else {


                daysLabel.textContent =
                    "DÍAS";


            }



            /*
            Esperar a que el navegador
            haya actualizado el contenido.
            */

            requestAnimationFrame(
                () => {


                    fitNumber();

                    fitDaysLabel();


                }
            );

        }



        /* ================================================================
           ROTACIÓN ALEATORIA DE FRASES
        ================================================================ */

        let currentPhraseIndex =
            Math.floor(

                Math.random() *
                phrases.length

            );



        /* ================================================================
           MOSTRAR FRASE
        ================================================================ */

        function showPhrase(
            index
        ) {


            phraseElement.textContent =
                phrases[index];



            requestAnimationFrame(
                () => {


                    fitPhrase();


                }
            );

        }



        /* ================================================================
           SIGUIENTE FRASE ALEATORIA
           SIN REPETIR INMEDIATAMENTE
        ================================================================ */

        function nextPhrase() {


            let newIndex;



            do {


                newIndex =
                    Math.floor(

                        Math.random() *
                        phrases.length

                    );


            }

            while (

                newIndex ===
                    currentPhraseIndex

                &&

                phrases.length > 1

            );



            currentPhraseIndex =
                newIndex;



            showPhrase(
                currentPhraseIndex
            );

        }



        /* ================================================================
           INICIALIZACIÓN
        ================================================================ */

        async function initialize() {


            /*
            ================================================================
            PRIMERO ESCALAR EL LIENZO

            Esto hace que la pieza se adapte desde el primer render.
            ================================================================
            */

            scaleStage();



            /*
            ================================================================
            ESPERAR LA FUENTE ADOBE

            Esto es importante porque las mediciones de texto
            deben realizarse con Alphabet Soup ya cargada.
            ================================================================
            */

            if (
                document.fonts
            ) {


                try {


                    await document.fonts.ready;


                }

                catch (
                    error
                ) {


                    console.log(
                        "No fue posible esperar la fuente."
                    );


                }


            }



            /*
            ================================================================
            CONTADOR
            ================================================================
            */

            updateCountdown();



            /*
            ================================================================
            PRIMERA FRASE ALEATORIA
            ================================================================
            */

            showPhrase(
                currentPhraseIndex
            );



            /*
            ================================================================
            CAMBIAR FRASE CADA 60 SEGUNDOS
            ================================================================
            */

            setInterval(

                nextPhrase,

                PHRASE_INTERVAL

            );



            /*
            ================================================================
            REVISAR CONTADOR CADA MINUTO

            Esto permite detectar el cambio de día sin
            necesidad de recargar la página.
            ================================================================
            */

            setInterval(

                updateCountdown,

                60000

            );

        }



        /* ================================================================
           EJECUTAR
        ================================================================ */

        initialize();


    </script>


</body>

</html>
