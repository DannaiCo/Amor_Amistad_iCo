<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <title>Dedicatorias</title>

  <!-- Rooney Sans -->
  <link rel="stylesheet" href="https://use.typekit.net/vsp7vcb.css" />

  <style>
    :root {
      --fade-video: 350ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffccdd;

      touch-action: none;
      user-select: none;
      -webkit-user-select: none;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffccdd;
    }

    /*
      Lienzo lógico fijo 2560 x 1440.
      JavaScript lo escala al tamaño real del player.
    */
    #stage {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 2560px;
      height: 1440px;

      overflow: hidden;
      background: #ffccdd;

      transform-origin: center center;
      transform: translate(-50%, -50%) scale(1);

      will-change: transform;
    }

    /*
      CANVAS DE RESPALDO
      Guarda el último frame válido del video activo.
      Si Chrome pausa el video por ahorro de energía, este frame queda visible
      y evita que el fondo pase a negro.
    */
    #fallback-canvas {
      position: absolute;
      inset: 0;

      width: 2560px;
      height: 1440px;

      z-index: 0;

      background: #ffccdd;

      pointer-events: none;
    }

    /*
      Los videos tienen src fijo: no se vuelve a cargar el archivo
      cada 10 segundos.
    */
    .background-video {
      position: absolute;
      inset: 0;

      width: 2560px;
      height: 1440px;

      object-fit: cover;
      object-position: center center;

      opacity: 0;
      z-index: 1;

      transition: opacity var(--fade-video) ease-in-out;

      pointer-events: none;

      transform: translateZ(0);
      backface-visibility: hidden;

      will-change: opacity;
    }

    /*
      El siguiente video se reproduce DETRÁS del video actual.
      Por eso puede preparar su primer frame sin dejar hueco negro.
    */
    .background-video.preparing {
      opacity: 1;
      z-index: 1;
    }

    /*
      Video que actualmente está en pantalla.
    */
    .background-video.active {
      opacity: 1;
      z-index: 2;
    }

    /*
      El video anterior se desvanece y revela el siguiente,
      que ya está reproduciéndose detrás.
    */
    .background-video.fading {
      opacity: 0;
      z-index: 2;
    }

    #nombre-container {
      position: absolute;

      left: 1280px;
      top: 720px;

      width: 1000px;

      transform: translate(-50%, -50%) rotate(-6deg);

      z-index: 10;

      pointer-events: none;
    }

    #nombre {
      width: 100%;

      margin: 0;
      padding: 0;

      font-family: "rooney-sans", sans-serif;
      font-weight: 900;
      font-style: normal;

      font-size: 180px;
      line-height: 0.95;
      letter-spacing: -4px;

      text-align: center;

      opacity: 0;

      transform: translateY(30px) scale(0.95);

      will-change: opacity, transform;
    }

    #nombre.animar {
      animation:
        entradaNombre
        500ms
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }

    @keyframes entradaNombre {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.94);
      }

      65% {
        opacity: 1;
        transform: translateY(-5px) scale(1.015);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #estado {
      position: absolute;

      left: 50%;
      bottom: 40px;

      transform: translateX(-50%);

      z-index: 20;

      font-family: Arial, sans-serif;
      font-size: 22px;

      color: rgba(255, 255, 255, 0.75);

      opacity: 0;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="viewport">

    <main id="stage">

      <canvas
        id="fallback-canvas"
        width="2560"
        height="1440"
      ></canvas>

      <!--
        Un video fijo por categoría.
        Importante: los archivos deben existir exactamente en /Fondos/
      -->

      <video
        id="video-pareja"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        src="Fondos/pareja.mp4"
      ></video>

      <video
        id="video-familia"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        src="Fondos/familia.mp4"
      ></video>

      <video
        id="video-arrocito"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        src="Fondos/arrocito.mp4"
      ></video>

      <video
        id="video-amigos"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        src="Fondos/amigos.mp4"
      ></video>

      <div id="nombre-container">
        <div id="nombre"></div>
      </div>

      <div id="estado">
        Esperando mensajes aprobados...
      </div>

    </main>

  </div>

  <script>
    /* =========================================================
       CONFIGURACIÓN
    ========================================================= */

    const BASE_WIDTH = 2560;
    const BASE_HEIGHT = 1440;

    /*
      cover:
      llena toda la pantalla manteniendo 16:9.
    */
    const MODO_ESCALA = "cover";

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwhf1ympD-ROuGCg9DhNkbvARi_b0W_3LUtuUv6Sj4YL7gJD3qF4XhfC46yKtRjLm3y/exec";

    /*
      El MENSAJE cambia cada 10 segundos.
    */
    const TIEMPO_CAMBIO_MENSAJE = 10000;

    /*
      La hoja se vuelve a consultar cada 30 segundos.
      El cambio de mensaje NO depende de Internet cada 10 segundos:
      usa una copia local de la última lista recibida.
    */
    const TIEMPO_REFRESCO_DATOS = 30000;

    /*
      Apps Script puede demorarse.
      El timeout de red es independiente del cambio de mensajes.
    */
    const TIMEOUT_API = 30000;

    const TIEMPO_FADE = 350;

    const CATEGORIAS = {
      pareja: {
        video: "Fondos/pareja.mp4",
        color: "#770222",
        x: 1150,
        y: 550,
        align: "center"
      },

      familia: {
        video: "Fondos/familia.mp4",
        color: "#871f0b",
        x: 1150,
        y: 540,
        align: "center"
      },

      arrocito: {
        video: "Fondos/arrocito.mp4",
        color: "#053a21",
        x: 1150,
        y: 610,
        align: "center"
      },

      amigos: {
        video: "Fondos/amigos.mp4",
        color: "#300194",
        x: 1150,
        y: 550,
        align: "center"
      }
    };

    /* =========================================================
       ELEMENTOS
    ========================================================= */

    const stage =
      document.getElementById("stage");

    const nombreContainer =
      document.getElementById("nombre-container");

    const nombreElemento =
      document.getElementById("nombre");

    const estadoElemento =
      document.getElementById("estado");

    const fallbackCanvas =
      document.getElementById("fallback-canvas");

    const fallbackContext =
      fallbackCanvas.getContext("2d");

    const videosPorTipo = {
      pareja:
        document.getElementById("video-pareja"),

      familia:
        document.getElementById("video-familia"),

      arrocito:
        document.getElementById("video-arrocito"),

      amigos:
        document.getElementById("video-amigos")
    };

    /* =========================================================
       ESTADO
    ========================================================= */

    let tipoVideoActivo = null;

    let mensajeActual = null;

    let mensajesCache = [];

    let actualizandoDatos = false;

    let cambiandoMensaje = false;

    let reanudandoVideo = false;

    /* =========================================================
       ESCALADO
    ========================================================= */

    function ajustarStageAlViewport() {
      const viewportWidth =
        window.innerWidth ||
        document.documentElement.clientWidth ||
        BASE_WIDTH;

      const viewportHeight =
        window.innerHeight ||
        document.documentElement.clientHeight ||
        BASE_HEIGHT;

      const escalaX =
        viewportWidth / BASE_WIDTH;

      const escalaY =
        viewportHeight / BASE_HEIGHT;

      const escala =
        MODO_ESCALA === "contain"
          ? Math.min(escalaX, escalaY)
          : Math.max(escalaX, escalaY);

      stage.style.transform =
        `translate(-50%, -50%) scale(${escala})`;
    }

    ajustarStageAlViewport();

    window.addEventListener(
      "resize",
      ajustarStageAlViewport
    );

    window.addEventListener(
      "orientationchange",
      ajustarStageAlViewport
    );

    setTimeout(
      ajustarStageAlViewport,
      250
    );

    setTimeout(
      ajustarStageAlViewport,
      1000
    );

    /* =========================================================
       UTILIDADES
    ========================================================= */

    function esperar(ms) {
      return new Promise(
        resolve => setTimeout(resolve, ms)
      );
    }

    function normalizarTexto(texto) {
      return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function obtenerTipo(mensaje) {
      const tipoDirecto =
        normalizarTexto(
          mensaje.tipo
        );

      if (
        CATEGORIAS[tipoDirecto]
      ) {
        return tipoDirecto;
      }

      const categoria =
        normalizarTexto(
          mensaje.categoria
        );

      if (
        categoria.includes("pareja")
      ) {
        return "pareja";
      }

      if (
        categoria.includes("familia")
      ) {
        return "familia";
      }

      if (
        categoria.includes("arrocito")
      ) {
        return "arrocito";
      }

      if (
        categoria.includes("amigos")
      ) {
        return "amigos";
      }

      return null;
    }

    function obtenerIdMensaje(mensaje) {
      if (
        mensaje.id !== undefined &&
        mensaje.id !== null
      ) {
        return String(mensaje.id);
      }

      return (
        normalizarTexto(mensaje.nombre) +
        "|" +
        normalizarTexto(mensaje.categoria)
      );
    }

    /* =========================================================
       RESPALDO DEL ÚLTIMO FRAME
    ========================================================= */

    function guardarFrame(video) {
      if (!video) {
        return false;
      }

      if (
        video.readyState < 2 ||
        !video.videoWidth ||
        !video.videoHeight
      ) {
        return false;
      }

      try {
        fallbackContext.drawImage(
          video,
          0,
          0,
          BASE_WIDTH,
          BASE_HEIGHT
        );

        return true;

      } catch (error) {
        console.warn(
          "[FALLBACK] No se pudo guardar el frame:",
          error
        );

        return false;
      }
    }

    function guardarFrameActivo() {
      if (!tipoVideoActivo) {
        return;
      }

      const video =
        videosPorTipo[tipoVideoActivo];

      guardarFrame(video);
    }

    /*
      Guarda un frame reciente de forma periódica.
      Si Chrome suspende el video, ya hay una imagen debajo.
    */
    setInterval(
      guardarFrameActivo,
      2000
    );

    /* =========================================================
       GOOGLE APPS SCRIPT / JSONP ROBUSTO
    ========================================================= */

    function consultarMensajes() {
      return new Promise(
        (resolve, reject) => {

          const callbackName =
            "__googleCallback_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 1000000
            );

          const script =
            document.createElement("script");

          let terminado = false;

          /*
            No eliminamos inmediatamente el callback cuando ocurre timeout.
            Si Google responde tarde, encontrará una función NO-OP
            en vez de producir:
            "__googleCallback_xxx is not defined".
          */
          function instalarCallbackVacio() {
            window[callbackName] =
              function () {
                /* respuesta tardía ignorada */
              };

            setTimeout(
              () => {
                try {
                  delete window[callbackName];
                } catch (error) {
                  window[callbackName] =
                    undefined;
                }
              },
              60000
            );
          }

          function quitarScript() {
            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }
          }

          const timeout =
            setTimeout(
              () => {
                if (terminado) {
                  return;
                }

                terminado = true;

                instalarCallbackVacio();

                /*
                  Quitar el tag no garantiza que una petición ya iniciada
                  se cancele. El callback vacío protege la respuesta tardía.
                */
                quitarScript();

                reject(
                  new Error(
                    "Apps Script tardó más de " +
                    TIMEOUT_API / 1000 +
                    " segundos."
                  )
                );
              },
              TIMEOUT_API
            );

          window[callbackName] =
            function (datos) {
              if (terminado) {
                return;
              }

              terminado = true;

              clearTimeout(timeout);

              quitarScript();

              /*
                Se deja temporalmente un callback vacío por seguridad
                antes de borrarlo.
              */
              instalarCallbackVacio();

              resolve(datos);
            };

          script.onerror =
            function () {
              if (terminado) {
                return;
              }

              terminado = true;

              clearTimeout(timeout);

              instalarCallbackVacio();

              quitarScript();

              reject(
                new Error(
                  "No fue posible conectar con Google Apps Script."
                )
              );
            };

          script.src =
            API_URL +
            "?modo=todos" +
            "&callback=" +
            encodeURIComponent(
              callbackName
            ) +
            "&_=" +
            Date.now();

          document.head.appendChild(
            script
          );
        }
      );
    }

    function validarMensajes(datos) {
      if (
        !datos ||
        datos.ok === false
      ) {
        throw new Error(
          datos && datos.error
            ? datos.error
            : "Respuesta inválida de Apps Script."
        );
      }

      const originales =
        Array.isArray(datos.mensajes)
          ? datos.mensajes
          : [];

      return originales.filter(
        mensaje => {
          const nombre =
            String(
              mensaje.nombre || ""
            ).trim();

          const tipo =
            obtenerTipo(mensaje);

          return (
            nombre !== "" &&
            tipo !== null
          );
        }
      );
    }

    /*
      Actualiza SOLO la caché.
      Si falla Internet o Apps Script, NO borra la caché anterior.
    */
    async function actualizarCacheMensajes() {
      if (actualizandoDatos) {
        return;
      }

      actualizandoDatos = true;

      try {
        const datos =
          await consultarMensajes();

        const nuevosMensajes =
          validarMensajes(datos);

        if (
          nuevosMensajes.length > 0
        ) {
          mensajesCache =
            nuevosMensajes.slice();

          estadoElemento.style.opacity =
            "0";

          console.log(
            "[DATOS] Mensajes aprobados:",
            mensajesCache.length
          );
        } else {
          console.warn(
            "[DATOS] No llegaron mensajes aprobados."
          );

          /*
            Si ya había mensajes en caché, seguimos usándolos.
          */
          if (!mensajesCache.length) {
            estadoElemento.textContent =
              "Esperando mensajes aprobados...";

            estadoElemento.style.opacity =
              "1";
          }
        }

      } catch (error) {
        console.warn(
          "[DATOS] No se pudo actualizar la hoja. Se conserva la caché anterior:",
          error
        );

        /*
          MUY IMPORTANTE:
          no se pone la pantalla en negro
          y no se elimina el mensaje actual.
        */
      } finally {
        actualizandoDatos = false;
      }
    }

    /* =========================================================
       ELECCIÓN ALEATORIA
    ========================================================= */

    function elegirAleatorio(mensajes) {
      if (!mensajes.length) {
        return null;
      }

      if (mensajes.length === 1) {
        return mensajes[0];
      }

      let candidatos =
        mensajes;

      if (
        mensajeActual !== null
      ) {
        candidatos =
          mensajes.filter(
            mensaje => {
              return (
                obtenerIdMensaje(mensaje) !==
                mensajeActual
              );
            }
          );

        if (!candidatos.length) {
          candidatos =
            mensajes;
        }
      }

      const indice =
        Math.floor(
          Math.random() *
          candidatos.length
        );

      return candidatos[indice];
    }

    /* =========================================================
       VIDEO
    ========================================================= */

    function esperarVideoListo(
      video,
      timeoutMs = 10000
    ) {
      return new Promise(
        (resolve, reject) => {

          if (
            video.readyState >= 3
          ) {
            resolve(true);
            return;
          }

          let terminado = false;

          const timeout =
            setTimeout(
              () => {
                if (terminado) {
                  return;
                }

                terminado = true;

                limpiar();

                reject(
                  new Error(
                    "El video tardó demasiado en estar listo."
                  )
                );
              },
              timeoutMs
            );

          function limpiar() {
            clearTimeout(timeout);

            video.removeEventListener(
              "canplay",
              listo
            );

            video.removeEventListener(
              "canplaythrough",
              listo
            );

            video.removeEventListener(
              "error",
              errorVideo
            );
          }

          function listo() {
            if (terminado) {
              return;
            }

            terminado = true;

            limpiar();

            resolve(true);
          }

          function errorVideo() {
            if (terminado) {
              return;
            }

            terminado = true;

            limpiar();

            reject(
              new Error(
                "No se pudo cargar: " +
                (
                  video.currentSrc ||
                  video.src
                )
              )
            );
          }

          video.addEventListener(
            "canplay",
            listo,
            { once: true }
          );

          video.addEventListener(
            "canplaythrough",
            listo,
            { once: true }
          );

          video.addEventListener(
            "error",
            errorVideo,
            { once: true }
          );

          if (
            video.readyState === 0
          ) {
            video.load();
          }
        }
      );
    }

    async function reproducirConReintentos(
      video,
      intentos = 3
    ) {
      for (
        let intento = 1;
        intento <= intentos;
        intento++
      ) {
        /*
          Si la página está oculta, Chrome puede pausar
          el video por ahorro de energía.
          No peleamos contra el navegador mientras está oculta.
        */
        if (document.hidden) {
          return false;
        }

        try {
          await video.play();

          return true;

        } catch (error) {
          console.warn(
            "[VIDEO] Intento " +
            intento +
            " falló:",
            error
          );

          if (
            intento < intentos
          ) {
            await esperar(
              400 * intento
            );
          }
        }
      }

      return false;
    }

    function esperarFrameReal(
      video,
      timeoutMs = 5000
    ) {
      return new Promise(
        resolve => {

          let terminado = false;

          let frameCallbackId = null;

          const timeout =
            setTimeout(
              () => finalizar(false),
              timeoutMs
            );

          function finalizar(ok) {
            if (terminado) {
              return;
            }

            terminado = true;

            clearTimeout(timeout);

            video.removeEventListener(
              "playing",
              onPlaying
            );

            video.removeEventListener(
              "timeupdate",
              onTimeUpdate
            );

            resolve(ok);
          }

          function onPlaying() {
            /*
              "playing" significa que el reproductor avanzó,
              pero esperamos un frame de composición si Chromium lo permite.
            */
            if (
              typeof video.requestVideoFrameCallback ===
              "function"
            ) {
              frameCallbackId =
                video.requestVideoFrameCallback(
                  () => finalizar(true)
                );
            } else {
              requestAnimationFrame(
                () => finalizar(true)
              );
            }
          }

          function onTimeUpdate() {
            if (
              video.readyState >= 2 &&
              !video.paused
            ) {
              finalizar(true);
            }
          }

          video.addEventListener(
            "playing",
            onPlaying,
            { once: true }
          );

          video.addEventListener(
            "timeupdate",
            onTimeUpdate
          );

          /*
            Si ya está reproduciendo, pedimos directamente
            el próximo frame.
          */
          if (
            !video.paused &&
            video.readyState >= 2
          ) {
            if (
              typeof video.requestVideoFrameCallback ===
              "function"
            ) {
              frameCallbackId =
                video.requestVideoFrameCallback(
                  () => finalizar(true)
                );
            } else {
              requestAnimationFrame(
                () => finalizar(true)
              );
            }
          }
        }
      );
    }

    /*
      Devuelve TRUE solamente si el fondo nuevo quedó listo.
      Si falla, el fondo y el nombre anteriores permanecen intactos.
    */
    async function cambiarFondo(tipo) {
      const videoNuevo =
        videosPorTipo[tipo];

      if (!videoNuevo) {
        return false;
      }

      /*
        Mismo fondo/categoría:
        no se hace transición.
      */
      if (
        tipo === tipoVideoActivo
      ) {
        if (
          videoNuevo.paused &&
          !document.hidden
        ) {
          guardarFrame(videoNuevo);

          const ok =
            await reproducirConReintentos(
              videoNuevo
            );

          if (ok) {
            await esperarFrameReal(
              videoNuevo,
              3000
            );

            videoNuevo.classList.add(
              "active"
            );
          }
        }

        return true;
      }

      /*
        Si la pestaña/player está oculto,
        NO se cambia de fondo.
        Esta es precisamente una condición en la que Chromium
        puede abortar play() para ahorrar energía.
      */
      if (document.hidden) {
        console.warn(
          "[VIDEO] Página oculta: se pospone el cambio."
        );

        return false;
      }

      const tipoAnterior =
        tipoVideoActivo;

      const videoAnterior =
        tipoAnterior
          ? videosPorTipo[tipoAnterior]
          : null;

      /*
        Antes de cualquier cambio guardamos el frame actual.
      */
      if (videoAnterior) {
        guardarFrame(
          videoAnterior
        );
      }

      try {
        await esperarVideoListo(
          videoNuevo
        );
      } catch (error) {
        console.warn(
          "[VIDEO] El siguiente fondo no está listo:",
          error
        );

        return false;
      }

      /*
        El nuevo video queda DETRÁS del actual y completamente opaco.
        No hay un hueco negro entre ambos.
      */
      videoNuevo.classList.remove(
        "fading",
        "active"
      );

      videoNuevo.classList.add(
        "preparing"
      );

      try {
        videoNuevo.currentTime = 0;
      } catch (error) {}

      const pudoReproducir =
        await reproducirConReintentos(
          videoNuevo
        );

      if (!pudoReproducir) {
        videoNuevo.classList.remove(
          "preparing"
        );

        return false;
      }

      const tieneFrame =
        await esperarFrameReal(
          videoNuevo
        );

      if (!tieneFrame) {
        console.warn(
          "[VIDEO] No apareció un frame nuevo; se conserva el fondo anterior."
        );

        videoNuevo.pause();

        videoNuevo.classList.remove(
          "preparing"
        );

        return false;
      }

      /*
        Actualizamos la imagen de seguridad con el fondo nuevo.
      */
      guardarFrame(
        videoNuevo
      );

      /*
        Si no había video anterior,
        simplemente activamos el nuevo.
      */
      if (!videoAnterior) {
        videoNuevo.classList.remove(
          "preparing"
        );

        videoNuevo.classList.add(
          "active"
        );

        tipoVideoActivo =
          tipo;

        return true;
      }

      /*
        El nuevo ya está reproduciéndose DETRÁS.
        Desvanecemos el anterior para revelarlo.
      */
      videoAnterior.classList.add(
        "fading"
      );

      await esperar(
        TIEMPO_FADE + 80
      );

      /*
        Ahora el nuevo pasa a ser el activo.
      */
      videoNuevo.classList.remove(
        "preparing"
      );

      videoNuevo.classList.add(
        "active"
      );

      /*
        El anterior ya puede salir.
      */
      videoAnterior.classList.remove(
        "active",
        "fading",
        "preparing"
      );

      videoAnterior.pause();

      tipoVideoActivo =
        tipo;

      return true;
    }

    /*
      Precarga inicial.
      NO intentamos reproducir los cuatro videos a la vez.
    */
    Object.entries(
      videosPorTipo
    ).forEach(
      ([tipo, video]) => {
        video.load();

        video.addEventListener(
          "error",
          () => {
            console.error(
              "[VIDEO ERROR]",
              tipo,
              video.currentSrc ||
              video.src,
              video.error
            );
          }
        );

        /*
          Si Chrome pausa el video ACTIVO,
          guardamos su último frame.
        */
        video.addEventListener(
          "pause",
          () => {
            if (
              tipo === tipoVideoActivo
            ) {
              guardarFrame(
                video
              );
            }
          }
        );
      }
    );

    /* =========================================================
       REANUDACIÓN DEL VIDEO ACTIVO
    ========================================================= */

    async function reanudarVideoActivo() {
      if (
        reanudandoVideo ||
        document.hidden ||
        !tipoVideoActivo
      ) {
        return;
      }

      const video =
        videosPorTipo[
          tipoVideoActivo
        ];

      if (
        !video ||
        !video.paused
      ) {
        return;
      }

      reanudandoVideo =
        true;

      try {
        /*
          Mientras se intenta reanudar,
          quitamos temporalmente el video para que se vea
          el canvas con el último frame válido y no un cuadro negro.
        */
        guardarFrame(
          video
        );

        video.classList.remove(
          "active"
        );

        const ok =
          await reproducirConReintentos(
            video,
            4
          );

        if (ok) {
          const frameOk =
            await esperarFrameReal(
              video,
              5000
            );

          if (frameOk) {
            guardarFrame(
              video
            );

            video.classList.add(
              "active"
            );
          }
        }

      } finally {
        reanudandoVideo =
          false;
      }
    }

    /*
      Si Chrome/player vuelve a primer plano,
      reanuda el video antes de hacer un nuevo cambio.
    */
    document.addEventListener(
      "visibilitychange",
      async () => {
        if (document.hidden) {
          guardarFrameActivo();

          return;
        }

        await esperar(250);

        await reanudarVideoActivo();
      }
    );

    /*
      Watchdog:
      si el video activo se detiene inesperadamente mientras la
      página está visible, intenta reanudarlo.
    */
    setInterval(
      () => {
        if (
          document.hidden ||
          !tipoVideoActivo
        ) {
          return;
        }

        const video =
          videosPorTipo[
            tipoVideoActivo
          ];

        if (
          video &&
          video.paused
        ) {
          reanudarVideoActivo();
        }
      },
      1500
    );

    /* =========================================================
       NOMBRE
    ========================================================= */

    function mostrarNombre(
      nombre,
      configuracion
    ) {
      nombreElemento.classList.remove(
        "animar"
      );

      void nombreElemento.offsetWidth;

      nombreElemento.textContent =
        nombre;

      nombreElemento.style.color =
        configuracion.color;

      nombreContainer.style.left =
        configuracion.x + "px";

      nombreContainer.style.top =
        configuracion.y + "px";

      nombreElemento.style.textAlign =
        configuracion.align ||
        "center";

      nombreElemento.classList.add(
        "animar"
      );
    }

    /* =========================================================
       MOSTRAR MENSAJE
    ========================================================= */

    async function mostrarMensaje(
      mensaje
    ) {
      const tipo =
        obtenerTipo(
          mensaje
        );

      if (!tipo) {
        return false;
      }

      const configuracion =
        CATEGORIAS[tipo];

      /*
        No cambiamos nombre hasta saber que el fondo
        correspondiente quedó listo.
      */
      const fondoOk =
        await cambiarFondo(
          tipo
        );

      if (!fondoOk) {
        console.warn(
          "[MENSAJE] Se mantiene el mensaje anterior porque el nuevo fondo no pudo reproducirse."
        );

        return false;
      }

      mostrarNombre(
        String(
          mensaje.nombre || ""
        ).trim(),
        configuracion
      );

      mensajeActual =
        obtenerIdMensaje(
          mensaje
        );

      return true;
    }

    /* =========================================================
       ROTACIÓN CADA 10 SEGUNDOS
    ========================================================= */

    async function cambiarMensajeDesdeCache() {
      if (
        cambiandoMensaje ||
        document.hidden ||
        !mensajesCache.length
      ) {
        return;
      }

      cambiandoMensaje =
        true;

      try {
        const mensaje =
          elegirAleatorio(
            mensajesCache
          );

        if (mensaje) {
          await mostrarMensaje(
            mensaje
          );
        }

      } catch (error) {
        console.warn(
          "[MENSAJE] No se pudo cambiar:",
          error
        );

      } finally {
        cambiandoMensaje =
          false;
      }
    }

    /* =========================================================
       BUCLES
    ========================================================= */

    async function iniciar() {
      /*
        Carga inicial de la hoja.
      */
      await actualizarCacheMensajes();

      /*
        Primer mensaje.
      */
      await cambiarMensajeDesdeCache();

      /*
        Los mensajes cambian cada 10 s usando la caché local.
      */
      setInterval(
        cambiarMensajeDesdeCache,
        TIEMPO_CAMBIO_MENSAJE
      );

      /*
        Google Sheets se vuelve a consultar cada 30 s.
        Si falla una consulta, la pantalla sigue funcionando
        con la última lista válida.
      */
      setInterval(
        actualizarCacheMensajes,
        TIEMPO_REFRESCO_DATOS
      );
    }

    iniciar();

    /* =========================================================
       BLOQUEO DE ZOOM
    ========================================================= */

    document.addEventListener(
      "wheel",
      event => {
        if (event.ctrlKey) {
          event.preventDefault();
        }
      },
      {
        passive: false
      }
    );

    document.addEventListener(
      "keydown",
      event => {
        if (
          event.ctrlKey &&
          (
            event.key === "+" ||
            event.key === "-" ||
            event.key === "=" ||
            event.key === "0"
          )
        ) {
          event.preventDefault();
        }
      }
    );

    document.addEventListener(
      "gesturestart",
      event => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "gesturechange",
      event => {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "gestureend",
      event => {
        event.preventDefault();
      }
    );
  </script>

</body>
